<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Team Tools</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --main-blue: #123b63;
      --aqua: #79c0c3;
      --orange: #e9660a;
      --soft-blue: #e9fbff;
      --soft-pink: #ffe8e8;
      --ink: #333;
      --line: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background: linear-gradient(
        135deg,
        #e9fbff 0%,
        #fef6ee 100%
      );
    }

    .page-header {
      width: 100%;
      padding: 22px 28px 16px;
      text-align: center;
    }

    .page-header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      color: var(--main-blue);
      letter-spacing: .4px;
    }

    .page-header h1 span {
      color: var(--orange);
    }

    .tabs {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 2px solid var(--aqua);
    }

    .tab-button {
      border: none;
      border-radius: 14px 14px 0 0;
      padding: 15px 12px;
      background: #e5e7eb;
      color: #555;
      font-family: 'Quicksand', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .tab-button:hover {
      background: #dce3e5;
      color: var(--main-blue);
    }

    .tab-button.active {
      background: #fff;
      color: var(--orange);
    }

    .tool-panel {
      display: none;
      width: 100%;
      min-height: calc(100vh - 130px);
    }

    .tool-panel.active {
      display: block;
    }

    .tool-frame {
      display: block;
      width: 100%;
      min-height: calc(100vh - 130px);
      height: calc(100vh - 130px);
      border: 0;
      margin: 0;
      padding: 0;
      background: transparent;
    }

    @media (max-width: 800px) {
      .tabs {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .page-header {
        padding: 16px 12px 12px;
      }

      .page-header h1 {
        font-size: 26px;
      }

      .tab-button {
        font-size: 13px;
        padding: 13px 6px;
      }

      .tool-frame {
        min-height: calc(100vh - 110px);
        height: calc(100vh - 110px);
      }
    }
  </style>
</head>

<body>

  <div class="page-header">
    <h1>Campaign Team <span>Tools</span></h1>
  </div>

  <div class="tabs">

    <button
      class="tab-button active"
      onclick="showTool('calcito', this)"
    >
      Calcito
    </button>

<button
  class="tab-button"
  onclick="showTool('event-campaign-tool', this)"
>
  Event Campaign Tool
</button>

    <button
      class="tab-button"
      onclick="showTool('pixel-checker', this)"
    >
      Pixel Checker
    </button>

    <button
      class="tab-button"
      onclick="showTool('geofence-counter', this)"
    >
      Geofence Counter
    </button>

  </div>


  <!-- =========================================================
       CALCITO
       ========================================================= -->

  <div id="calcito" class="tool-panel active">

    <iframe
      id="calcitoFrame"
      class="tool-frame"
      title="Calcito"
    ></iframe>

  </div>


  <!-- =========================================================
       EVENT CAMPAIGN TOOL
       ========================================================= -->

  <div id="event-campaign-tool" class="tool-panel">

    <iframe
      id="eventConverterFrame"
      class="tool-frame"
      title="Event Campaign Tool"
    ></iframe>

  </div>

  <!-- =========================================================
       PIXEL CHECKER
       ========================================================= -->

  <div id="pixel-checker" class="tool-panel">

    <iframe
      id="pixelCheckerFrame"
      class="tool-frame"
      title="Pixel Checker"
    ></iframe>

  </div>

  <!-- =========================================================
       GEOFENCE COUNTER
       ========================================================= -->

  <div id="geofence-counter" class="tool-panel">

    <iframe
      id="geofenceCounterFrame"
      class="tool-frame"
      title="Geofence Counter"
    ></iframe>

  </div>


  <!-- =========================================================
       CALCITO TEMPLATE
       ========================================================= -->

  <template id="calcitoTemplate">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calcito</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --main-blue: #123b63;
      --aqua: #79c0c3;
      --orange: #e9660a;
      --bg-light: #fefeff;
      --bg-soft: #f0f7f8;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    body, input, select, textarea, button, .results {
      font-family: 'Quicksand', sans-serif !important;
      background: linear-gradient(135deg, #e9fbff 0%, #fef6ee 100%);
      padding: 1.5rem;
      color: var(--main-blue);
      font-size: 1rem;
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      font-weight: 700;
      margin: 0.3rem 0 0.5rem;
      letter-spacing: 1px;
    }

    h1 span:first-child { color: var(--main-blue); }
    h1 span:last-child { color: var(--orange); }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 0.5rem;
      align-items: flex-start;
    }

    .left, .right {
      flex: 1 1 400px;
    }

    .section-box {
      border-radius: 15px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      background-color: var(--bg-soft);
      box-shadow: 0 3px 10px var(--shadow);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .section-title {
      font-size: 1.2rem;
      color: var(--orange);
      margin-bottom: 0.6rem;
      font-weight: 600;
      border-bottom: 2px solid var(--aqua);
      padding-bottom: 0.3rem;
    }

    label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--main-blue);
    }

    input[type='number'], select {
      width: 98%;
      padding: 0.45rem 0.6rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #cce5e7;
      background: white;
      margin-bottom: 0.75rem;
      color: #333;
      box-shadow: none;
    }

    .inline-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .inline-row button {
      padding: 0.4rem 0.9rem;
      font-size: 0.95rem;
      background: linear-gradient(145deg, var(--aqua), #8ed5d7);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .inline-row input[type='number'] {
      width: 100%;
      flex: 1;
      margin: 0;
    }

    .results {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      box-shadow: 0 3px 12px var(--shadow);
      font-size: 0.95rem;
    }

    .results div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
      line-height: 1.3;
      gap: 1rem;
    }

    .highlight {
      font-weight: 600;
      color: var(--main-blue);
      font-size: 0.96rem;
    }

    .value {
      font-weight: 600;
      color: #333;
      font-size: 0.95rem;
      min-width: 120px;
      text-align: right;
    }

    .results::before {
      content: 'Budgets';
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--orange);
      display: block;
      margin-bottom: 0.8rem;
      text-align: left;
    }

    .top-center {
      text-align: center;
      margin-bottom: 1rem;
    }

    .top-center input {
      padding: 0.5rem;
      font-size: 1.1rem;
      width: 220px;
      border-radius: 10px;
      border: 1px solid #a7d2d4;
      background: white;
      color: #333;
      text-align: center;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
    }

    .buttons-row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .big-button {
      flex: 1;
      padding: 1rem;
      font-size: 1.05rem;
      background: linear-gradient(145deg, var(--aqua), #7dd2d4);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 3px 10px var(--shadow);
      transition: all 0.2s ease;
    }

    .big-button:hover { background: #5aaeb1; }

    #resetBtn {
      background: linear-gradient(145deg, #e9660a, #f2863d);
    }

    #resetBtn:hover { background: #cc5a08; }
  </style>
</head>

<body>

  <h1><span>Cal</span><span>cito</span></h1>

  <div class="top-center">
    <label for="packageBudget">Total Package Budget $:</label>
    <input type="number" id="packageBudget" placeholder="Enter budget" />
  </div>

  <div class="container">

    <div class="left">

      <div class="section-box">
        <div class="section-title">Main Campaigns</div>

        <label>Competitor Resident Geofences</label>
        <input type="number" id="compTargets" />

        <label>Employer Geofences</label>
        <input type="number" id="empTargets" />

        <label>POI Geofences</label>
        <input type="number" id="poiTargets" />

        <label>Emp-POI / Isolation 1</label>
        <input type="number" id="combinedTargets" />

        <label>Isolation 2</label>
        <input type="number" id="isolation2Targets" />

        <label>Other Campaign Geofences</label>
        <input type="number" id="otherTargets" />

        <label>Competitor-Resident Streaming TV</label>

        <div class="inline-row">
          <button type="button" onclick="calculateCompTV()">Calculate</button>
          <input type="number" id="compStreamingTV" />
        </div>

        <label>Hulu Competitor-Resident Streaming TV</label>

        <div class="inline-row">
          <button type="button" onclick="calculateHuluCompTV()">Calculate</button>
          <input type="number" id="huluCompTVBudget" />
        </div>

      </div>


      <div class="section-box">

        <div class="section-title">Addressable Campaigns</div>

        <label for="includeAddressable">Addressable Campaign</label>

        <select id="includeAddressable">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>

        <label>Addressable Streaming TV</label>

        <div class="inline-row">
          <button type="button" onclick="calculateAddrTV()">Calculate</button>
          <input type="number" id="addressableTVBudget" />
        </div>

        <label>Hulu Addressable Streaming TV</label>

        <div class="inline-row">
          <button type="button" onclick="calculateHuluAddrTV()">Calculate</button>
          <input type="number" id="huluAddrTVBudget" />
        </div>

      </div>


      <div class="section-box">

        <div class="section-title">Retargeting Campaigns</div>

        <label>Site Retargeting ($)</label>
        <input type="number" id="siteRetargeting" />

        <label>Search Retargeting ($)</label>
        <input type="number" id="searchRetargeting" />

      </div>


      <div class="section-box">

        <div class="section-title">ReTV Campaigns</div>

        <label for="retvTier">ReTV Tier:</label>

        <select id="retvTier">
          <option value="0">None</option>
          <option value="1">Tier 1 $130</option>
          <option value="2">Tier 2 $260</option>
          <option value="3">Tier 3 $390</option>
          <option value="4">Tier 4 $520</option>
        </select>

      </div>

    </div>


    <div class="right">

      <div class="results" id="results"></div>

      <div class="buttons-row">
        <button class="big-button" onclick="calculateBudgets()">Calculate</button>
        <button class="big-button" id="resetBtn" onclick="resetAll()">Reset</button>
      </div>

    </div>

  </div>


<script>

function round2(num) {
  return Math.round(num*100)/100;
}

function calculateCompTV() {
  const totalBudget = parseFloat(document.getElementById('packageBudget').value) || 0;
  const huluComp = parseFloat(document.getElementById('huluCompTVBudget').value);
  const compTV = (!isNaN(huluComp) && huluComp>0) ? totalBudget*0.15 : totalBudget*0.3;
  document.getElementById('compStreamingTV').value = round2(compTV);
}

function calculateHuluCompTV() {
  const totalBudget = parseFloat(document.getElementById('packageBudget').value) || 0;
  document.getElementById('huluCompTVBudget').value = round2(totalBudget*0.15);
  calculateCompTV();
}

function calculateAddrTV() {
  const totalBudget = parseFloat(document.getElementById('packageBudget').value) || 0;
  const addrBudget = totalBudget*0.5;
  const huluVal = parseFloat(document.getElementById('huluAddrTVBudget').value)||0;
  const addrTV = round2(addrBudget*0.5 - huluVal);
  document.getElementById('addressableTVBudget').value = addrTV>0 ? addrTV:0;
  document.getElementById('includeAddressable').value = 'yes';
}

function calculateHuluAddrTV() {
  const addrVal = parseFloat(document.getElementById('addressableTVBudget').value)||0;
  document.getElementById('huluAddrTVBudget').value = round2(addrVal*0.5);
  calculateAddrTV();
}

function calculateBudgets() {

  const total = parseFloat(document.getElementById('packageBudget').value)||0;

  const site = parseFloat(document.getElementById('siteRetargeting').value)||0;
  const search = parseFloat(document.getElementById('searchRetargeting').value)||0;
  const retargetingTotal = site + search;

  const comp = +document.getElementById('compTargets').value||0;
  const emp = +document.getElementById('empTargets').value||0;
  const poi = +document.getElementById('poiTargets').value||0;
  const comb = +document.getElementById('combinedTargets').value||0;
  const iso2 = +document.getElementById('isolation2Targets').value||0;
  const other = +document.getElementById('otherTargets').value||0;

  const totalTargets = comp+emp+poi+comb+iso2+other||1;

  const retvTier = +document.getElementById('retvTier').value;

  let retv = 0, huluRetv = 0;

  if(retvTier===1) [retv,huluRetv]=[95,35];
  else if(retvTier===2) [retv,huluRetv]=[190,70];
  else if(retvTier===3) [retv,huluRetv]=[285,105];
  else if(retvTier===4) [retv,huluRetv]=[380,140];

  const compTV = +document.getElementById('compStreamingTV').value||0;
  const huluComp = +document.getElementById('huluCompTVBudget').value||0;

  const addrYes = document.getElementById('includeAddressable').value==='yes';
  const addrTV = +document.getElementById('addressableTVBudget').value||0;
  const huluAddr = +document.getElementById('huluAddrTVBudget').value||0;

  const addr = addrYes ? total*0.5 - addrTV - huluAddr : 0;

  const remaining = Math.max(
    total -
    retargetingTotal -
    compTV -
    huluComp -
    addr -
    addrTV -
    huluAddr,
    0
  );

  let resultsHTML = '';

  resultsHTML += `
    <div>
      <span class="highlight">Total Package Budget:</span>
      <span class="value">$${round2(total)}</span>
    </div>
  `;

  if(retvTier>0){

    resultsHTML += `
      <div>
        <span class="highlight">ReTV Add-on:</span>
        <span class="value">$${round2(retv+huluRetv)}</span>
      </div>
    `;

    resultsHTML += `
      <div>
        <span class="highlight">Total Budget:</span>
        <span class="value">$${round2(total+(retv+huluRetv))}</span>
      </div>
    `;

    resultsHTML += `<hr/>`;
  }

  if(site>0)
    resultsHTML += `
      <div>
        <span class="highlight">Site Retargeting:</span>
        <span class="value">$${round2(site)}</span>
      </div>
    `;

  if(search>0)
    resultsHTML += `
      <div>
        <span class="highlight">Search Retargeting:</span>
        <span class="value">$${round2(search)}</span>
      </div>
    `;

  if(compTV>0)
    resultsHTML += `
      <div>
        <span class="highlight">Competitor Resident Streaming TV:</span>
        <span class="value">$${round2(compTV)}</span>
      </div>
    `;

  if(huluComp>0)
    resultsHTML += `
      <div>
        <span class="highlight">Hulu Competitor Resident Streaming TV:</span>
        <span class="value">$${round2(huluComp)}</span>
      </div>
    `;

  if(addrYes && addr>0)
    resultsHTML += `
      <div>
        <span class="highlight">Addressable Campaign:</span>
        <span class="value">$${round2(addr)}</span>
      </div>
    `;

  if(addrTV>0)
    resultsHTML += `
      <div>
        <span class="highlight">Addressable Streaming TV:</span>
        <span class="value">$${round2(addrTV)}</span>
      </div>
    `;

  if(huluAddr>0)
    resultsHTML += `
      <div>
        <span class="highlight">Hulu Addressable Streaming TV:</span>
        <span class="value">$${round2(huluAddr)}</span>
      </div>
    `;

  if(retv>0)
    resultsHTML += `
      <div>
        <span class="highlight">ReTV:</span>
        <span class="value">$${round2(retv)}</span>
      </div>
    `;

  if(huluRetv>0)
    resultsHTML += `
      <div>
        <span class="highlight">Hulu ReTV:</span>
        <span class="value">$${round2(huluRetv)}</span>
      </div>
    `;

  if((comp+emp+poi+comb+iso2+other)>0 && remaining>0){

    resultsHTML += `<hr/>`;

    if(comp>0)
      resultsHTML += `
        <div>
          <span class="highlight">Competitor Resident Geofences:</span>
          <span class="value">$${round2((remaining*comp)/totalTargets)}</span>
        </div>
      `;

    if(emp>0)
      resultsHTML += `
        <div>
          <span class="highlight">Employer Geofences:</span>
          <span class="value">$${round2((remaining*emp)/totalTargets)}</span>
        </div>
      `;

    if(poi>0)
      resultsHTML += `
        <div>
          <span class="highlight">POI Geofences:</span>
          <span class="value">$${round2((remaining*poi)/totalTargets)}</span>
        </div>
      `;

    if(comb>0)
      resultsHTML += `
        <div>
          <span class="highlight">Emp-POI / Isolation 1:</span>
          <span class="value">$${round2((remaining*comb)/totalTargets)}</span>
        </div>
      `;

    if(iso2>0)
      resultsHTML += `
        <div>
          <span class="highlight">Isolation 2 Geofences:</span>
          <span class="value">$${round2((remaining*iso2)/totalTargets)}</span>
        </div>
      `;

    if(other>0)
      resultsHTML += `
        <div>
          <span class="highlight">Other Campaign Geofences:</span>
          <span class="value">$${round2((remaining*other)/totalTargets)}</span>
        </div>
      `;
  }

  document.getElementById('results').innerHTML = resultsHTML;
}

function resetAll(){

  document.querySelectorAll('input, select').forEach(el =>
    el.value =
      el.tagName==='SELECT'
        ? el.options[0].value
        : ''
  );

  document.getElementById('results').innerHTML='';
}

</script>

  </template>

  <template id="eventCampaignToolTemplate">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Campaign Time Converter</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>

      --cyan: #79c0c3;
      --orange: #e9660a;

      margin: 0 0 25px;

      color: var(--orange);

      letter-spacing: .3px;
    }

    .converter-container h2 {
      white-space: nowrap;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;

    }

    input[type="time"]:focus,

      box-shadow: 0 2px 6px rgba(233, 102, 10, 0.25);
      outline: none;

      background: #f9fafb;
      color: #555;
    }

      display: flex;
      gap: 10px;
      align-items: center;

    .row > div {
      flex: 1;

      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .budget-row > div {
      flex: 1;
      min-width: 0;
    }

    .hint {
      color: #555;
      font-size: 12px;
      text-align: left;
      margin-top: -8px;
      margin-bottom: 8px;
      opacity: .75;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
      font-size: 14px;
      color: var(--ink);
      cursor: pointer;
      justify-content: flex-start;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: relative;
      width: 50px;
      height: 26px;
      background-color: var(--line);
      border-radius: 20px;
      transition: 0.3s;
      flex-shrink: 0;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .switch input:checked + .slider {
      background-color: var(--orange);
    }

    .switch input:checked + .slider::before {
      transform: translateX(24px);
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      background: var(--orange);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Quicksand', sans-serif;
      letter-spacing: .3px;
    }

    button:hover {
      background: #cf5609;
    }

    .result {
      margin-top: 16px;
      font-size: 15px;
      color: var(--ink);
      text-align: left;
      display: none;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      background: #fff;
    }

    .result strong {
      display: block;
      margin-bottom: 6px;
      color: var(--cyan);
    }

    .budget-result {
      border-color: var(--cyan);
      line-height: 1.5;
    }

    .budget-result .budget-message {
      margin-bottom: 14px;
    }

    .budget-result .budget-total {
      font-size: 17px;
      font-weight: 700;
      color: var(--orange);
    }

    .error {
      color: var(--err);
      font-size: 12px;
      text-align: left;
      margin-top: -4px;
      margin-bottom: 8px;
    }

    .muted {
      color: #777;
    }

    #resetBtn,
    #budgetResetBtn {
      display: none;
      margin-top: 10px;
      background: #fff;
      color: var(--orange);
      border: 1px solid var(--orange);
    }

    #resetBtn:hover,
    #budgetResetBtn:hover {
      background: #fff6ef;
    }

    .other-campaign {
      display: none;
    }

    .currency-input {
      position: relative;
    }

    .currency-symbol {
      position: absolute;
      left: 12px;
      top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      pointer-events: none;
      z-index: 1;
    }

    .currency-input input {
      padding-left: 28px;
    }

    @media (max-width: 900px) {
      body {
        padding: 20px;
      }

      .tools-wrapper {
        flex-direction: column;
        max-width: 600px;
      }

      .converter-container,
      .budget-container {
        width: 100%;
        min-width: 0;
      }

      .converter-container h2 {
        white-space: normal;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .container {
        padding: 22px;
      }

      h2 {
        font-size: 21px;
      }

      .row {
        flex-direction: column;
        gap: 0;
      }

      .row > div {
        width: 100%;
      }

      .budget-row {
        flex-direction: column;
        gap: 0;
      }

      .budget-row > div {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="tools-wrapper">

    <!-- ========================================= -->
    <!-- EVENT CAMPAIGN TIME CONVERTER             -->
    <!-- ========================================= -->

    <div class="container converter-container">

      <h2>
  <span style="color: #123b63;">Event Campaign</span>
  <span style="color: var(--orange);">Time Converter</span>
</h2>

      <!-- ZIP or Postal and detected TZ -->
      <div class="row">

        <div>
          <label>ZIP or Postal Code US or CA</label>

          <input
            type="text"
            id="zipCode"
            placeholder="e.g. 90210 or M5V 2T6"

          <div
            id="zipError"

          ></div>
        </div>

        <div>
          <label>Detected Time Zone</label>

            id="tzDisplay"

            disabled
          />
        </div>

      </div>

      <div class="hint">
        Works for US ZIP five digits and Canadian postal codes like A1A 1A1.
      </div>

      <!-- Date range -->
      <label>Original Date Range</label>

      <div class="row">

        <div>

        </div>

        <div>

    <!-- ========================================= -->
    <!-- EVENT CAMPAIGN BUDGET                     -->
    <!-- ========================================= -->

    <div class="container budget-container">

      <h2>
  <span style="color: #123b63;">Event Campaign</span>
  <span style="color: var(--orange);">Budget</span>
</h2>

      <!-- Total Campaign Budget and Total Event Budget -->
      <div class="budget-row">

        <div>
          <label for="totalCampaignBudget">

          <div class="currency-input">

        <div>

          </label>

            <span class="currency-symbol">$</span>

              type="number"
              id="totalEventBudget"

              min="0"
              step="0.01"
            >

          </div>

      </div>


      <!-- Budget Source Month -->

      </label>

      <select id="billingMonth">

        <option value="">

        <option value="January">January</option>
        <option value="February">February</option>
        <option value="March">March</option>
        <option value="April">April</option>
        <option value="May">May</option>
        <option value="June">June</option>
        <option value="July">July</option>
        <option value="August">August</option>
        <option value="September">September</option>
        <option value="October">October</option>

        <option value="December">December</option>

      <!-- Campaign Where Budget Was Taken From -->

      </label>

      <select
        id="budgetSource"
        onchange="handleBudgetSource()"
      >

        </option>

        <option value="Competitor Resident">

        </option>

        <option value="Employer">

        </option>

        <option value="POI">

        </option>

        <option value="Other">

        </option>

      <!-- Other Campaign -->
      <div
        class="other-campaign"
        id="otherCampaignWrapper"
      >

        </label>

        <input
          type="text"
          id="otherCampaign"
          placeholder="Enter campaign name"
        >

      </div>


      <!-- Event Campaign End Date -->
      <label for="eventEndDate">
        Event Campaign End Date
      </label>

      <input
        type="date"
        id="eventEndDate"

      <!-- Calculate -->
      <button
        id="calculateBudgetBtn"

        id="budgetResetBtn"

      >
        Reset
      </button>

    </div>

  </div>


  <script>

    /* =====================================================
       TIME ZONE HELPERS AND VALIDATION
       ===================================================== */

    const offsets = {
      EST: -5,
      CST: -6,
      MST: -7,
      PST: -8,
      AKST: -9,
      HST: -10,
      AST: -4,
      NST: -3.5
    };


    const US_STATE_DEFAULT_TZ = {
      AL:"CST",
      AK:"AKST",
      AZ:"MST",
      AR:"CST",
      CA:"PST",
      CO:"MST",
      CT:"EST",
      DC:"EST",
      DE:"EST",
      FL:"EST",
      GA:"EST",
      HI:"HST",
      IA:"CST",
      ID:"MST",
      IL:"CST",
      IN:"EST",
      KS:"CST",
      KY:"EST",
      LA:"CST",
      MA:"EST",
      MD:"EST",
      ME:"EST",
      MI:"EST",
      MN:"CST",
      MO:"CST",
      MS:"CST",
      MT:"MST",
      NC:"EST",
      ND:"CST",
      NE:"CST",
      NH:"EST",
      NJ:"EST",
      NM:"MST",
      NV:"PST",
      NY:"EST",
      OH:"EST",
      OK:"CST",
      OR:"PST",
      PA:"EST",
      RI:"EST",
      SC:"EST",
      SD:"CST",
      TN:"CST",
      TX:"CST",
      UT:"MST",
      VA:"EST",
      VT:"EST",
      WA:"PST",
      WI:"CST",
      WV:"EST",
      WY:"MST",
      PR:"AST"
    };


    const CA_PROV_DEFAULT_TZ = {
      NL:"NST",
      NS:"AST",
      PE:"AST",
      NB:"AST",
      QC:"EST",
      ON:"EST",
      MB:"CST",
      SK:"CST",
      AB:"MST",
      BC:"PST",
      YT:"MST",
      NT:"MST",
      NU:"EST"
    };


    const ZIP_EXCEPTIONS_TZ = [
      {range:[324,325], tz:"CST"},
      {range:[463,464], tz:"CST"},
      {range:[476,477], tz:"CST"},
      {range:[498,499], tz:"CST"},
      {range:[586,588], tz:"MST"},
      {range:[693,693], tz:"MST"},
      {range:[577,577], tz:"MST"},
      {range:[979,979], tz:"MST"},
      {range:[838,838], tz:"PST"},
      {range:[835,835], tz:"PST"},
      {range:[798,799], tz:"MST"},
      {range:[885,885], tz:"MST"},
      {range:[376,385], tz:"EST"}
    ];


    function refineCanadaTZ(prov, lon) {

      if (!isFinite(lon)) {
        return CA_PROV_DEFAULT_TZ[prov] || "EST";
      }

      if (prov === "ON" && lon < -90) {
        return "CST";
      }

      if (prov === "BC" && lon > -121) {
        return "MST";
      }

      if (prov === "NU" && lon < -95) {
        return "CST";
      }

      return CA_PROV_DEFAULT_TZ[prov] || "EST";
    }


    const US_ZIP_RE =
      /^\d{5}(?:-\d{4})?$/i;


    const CA_POSTAL_RE =
      /^[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTV-Z][\s-]?\d[ABCEGHJ-NPRSTV-Z]\d$/i;


    function zip3(zip5) {
      return parseInt(zip5.slice(0, 3), 10);
    }


    function checkUSExceptions(zip5) {

      const z3 = zip3(zip5);

      for (const ex of ZIP_EXCEPTIONS_TZ) {

        if (
          z3 >= ex.range[0] &&
          z3 <= ex.range[1]
        ) {
          return ex.tz;
        }

      }

      return null;
    }


    async function detectTimezoneFromInput() {

      const zipInput =
        document.getElementById('zipCode').value.trim();

      const tzBox =
        document.getElementById('tzDisplay');

      const errBox =
        document.getElementById('zipError');


      errBox.style.display = "none";
      tzBox.value = "-";


      if (!zipInput) {

        errBox.textContent =
          "Please enter a ZIP or postal code.";

        errBox.style.display = "block";

        return null;
      }


      try {

        if (US_ZIP_RE.test(zipInput)) {

          const zip5 =
            zipInput.replace(/-.+$/, "");

          const res =
            await fetch(
              `https://api.zippopotam.us/us/${zip5}`
            );


          if (res.ok) {

            const data =
              await res.json();

            const state =
              (
                data.places?.[0]?.[
                  'state abbreviation'
                ] || ""
              ).toUpperCase();


            const exTz =
              checkUSExceptions(zip5);


            const tz =
              exTz ||
              (US_STATE_DEFAULT_TZ[state] || "EST");


            tzBox.value = tz;

            return tz;
          }
        }


        if (CA_POSTAL_RE.test(zipInput)) {

          const postal =
            zipInput
              .toUpperCase()
              .replace(/\s+/g, "");


          const res =
            await fetch(
              `https://api.zippopotam.us/ca/${postal}`
            );


          if (res.ok) {

            const data =
              await res.json();


            const prov =
              (
                data.places?.[0]?.[
                  'state abbreviation'
                ] || ""
              ).toUpperCase();


            const lon =
              parseFloat(
                data.places?.[0]?.longitude
              );


            const tz =
              refineCanadaTZ(prov, lon);


            tzBox.value = tz;

            return tz;
          }
        }


        errBox.textContent =
          "Invalid or unsupported code. Try another US ZIP or Canadian postal code.";

        errBox.style.display = "block";

        return null;

      } catch (e) {

        errBox.textContent =
          "Lookup failed. Please try again.";

        errBox.style.display = "block";

        return null;
      }
    }


    document
      .getElementById('zipCode')
      .addEventListener(
        'blur',
        detectTimezoneFromInput
      );


    document
      .getElementById('zipCode')
      .addEventListener(
        'keyup',
        (e) => {

          if (e.key === 'Enter') {
            detectTimezoneFromInput();
          }

        }
      );


    /* =====================================================
       DATE AND TIME MATH
       ===================================================== */

    function parseTimeToMinutes(t) {

      const [h, m] =
        t.split(":").map(Number);

      return h * 60 + m;
    }


    function formatClock(mins) {

      mins =
        ((mins % 1440) + 1440) % 1440;

      const h24 =
        Math.floor(mins / 60);

      const m =
        mins % 60;

      const ampm =
        h24 >= 12 ? "PM" : "AM";

      const h12 =
        (h24 % 12) || 12;

      return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
    }


    function parseISODate(iso) {

      const [y, m, d] =
        iso.split("-").map(Number);

      return new Date(
        Date.UTC(y, m - 1, d)
      );
    }


    function addDays(dateObj, days) {

      const d =
        new Date(dateObj.getTime());

      d.setUTCDate(
        d.getUTCDate() + days
      );

      return d;
    }


    function formatISODateUTC(dateObj) {

      const y =
        dateObj.getUTCFullYear();

      const m =
        String(
          dateObj.getUTCMonth() + 1
        ).padStart(2, '0');

      const d =
        String(
          dateObj.getUTCDate()
        ).padStart(2, '0');

      return `${y}-${m}-${d}`;
    }


    function daysBetweenISO(a, b) {

      const A = parseISODate(a);
      const B = parseISODate(b);

      const msPerDay = 86400000;

      return Math.round(
        (B - A) / msPerDay
      );
    }


    function splitDay(totalMinutes) {

      const dayOffset =
        Math.floor(totalMinutes / 1440);

      let mins =
        totalMinutes -
        dayOffset * 1440;


      if (mins < 0) {

        mins += 1440;

        return {
          day: dayOffset - 1,
          mins
        };
      }


      return {
        day: dayOffset,
        mins
      };
    }


    /* =====================================================
       MAIN TIME CONVERSION
       ===================================================== */

    async function convertToCST() {

      const startDate =
        document.getElementById('startDate').value;

      const endDate =
        document.getElementById('endDate').value;

      const startTime =
        document.getElementById('startTime').value;

      const endTime =
        document.getElementById('endTime').value;

      const addBuffer =
        document.getElementById('buffer').checked;

      const tzBox =
        document.getElementById('tzDisplay');


      if (
        !startDate ||
        !endDate ||
        !startTime ||
        !endTime
      ) {

        showResult(
          `<p>Please enter both dates and times.</p>`
        );

        return;
      }


      const daysGap =
        daysBetweenISO(
          startDate,
          endDate
        );


      const startM =
        parseTimeToMinutes(startTime);

      const endM =
        parseTimeToMinutes(endTime);


      const endTotalFromStart =
        daysGap * 1440 + endM;


      if (endTotalFromStart < startM) {

        showResult(
          `<p>End date and time must be after start date and time.</p>`
        );

        return;
      }


      let sourceTz =
        tzBox.value;


      if (
        !sourceTz ||
        sourceTz === "-"
      ) {

        sourceTz =
          await detectTimezoneFromInput();
      }


      if (
        !sourceTz ||
        !(sourceTz in offsets)
      ) {

        showResult(
          `<p>Please enter a valid US ZIP or Canadian postal code first.</p>`
        );

        return;
      }


      const offsetDiffMinutes =
        (
          offsets["CST"] -
          offsets[sourceTz]
        ) * 60;


      const startTotal =
        startM + offsetDiffMinutes;

      const endTotal =
        endTotalFromStart +
        offsetDiffMinutes;


      const startSplit =
        splitDay(startTotal);

      const endSplit =
        splitDay(endTotal);


      const startDateObj =
        parseISODate(startDate);


      const startDateCST =
        addDays(
          startDateObj,
          startSplit.day
        );


      const endDateCST =
        addDays(
          startDateObj,
          endSplit.day
        );


      let monitorStartSplit =
        startSplit;

      let monitorEndSplit =
        endSplit;

      let monitorStartDateCST =
        startDateCST;

      let monitorEndDateCST =
        endDateCST;


      if (addBuffer) {

        const bStart =
          splitDay(
            startTotal - 60
          );

        const bEnd =
          splitDay(
            endTotal + 60
          );


        monitorStartSplit =
          bStart;

        monitorEndSplit =
          bEnd;


        monitorStartDateCST =
          addDays(
            startDateObj,
            bStart.day
          );


        monitorEndDateCST =
          addDays(
            startDateObj,
            bEnd.day
          );
      }


      const liveWindow =
        `${formatISODateUTC(startDateCST)} ${formatClock(startSplit.mins)} – ${formatISODateUTC(endDateCST)} ${formatClock(endSplit.mins)} CST`;


      const monitoringWindow =
        addBuffer
          ? `${formatISODateUTC(monitorStartDateCST)} ${formatClock(monitorStartSplit.mins)} – ${formatISODateUTC(monitorEndDateCST)} ${formatClock(monitorEndSplit.mins)} CST`
          : liveWindow;


      showResult(`

        <strong>Campaign Live Window</strong>

        <div>
          ${liveWindow}
        </div>

        <br>

        <strong style="color: var(--orange);">
          Monitoring Window
          ${addBuffer ? "(with buffer)" : ""}
        </strong>

        <div>
          ${monitoringWindow}
        </div>

      `);


      document.getElementById(
        'resetBtn'
      ).style.display = "block";
    }


    function showResult(html) {

      const box =
        document.getElementById('result');

      box.style.display = "block";

      box.innerHTML = html;
    }


    function resetForm() {

      document.getElementById(
        'zipCode'
      ).value = "";


      document.getElementById(
        'tzDisplay'
      ).value = "-";


      const today =
        new Date();


      const y =
        today.getFullYear();

      const m =
        String(
          today.getMonth() + 1
        ).padStart(2, '0');

      const d =
        String(
          today.getDate()
        ).padStart(2, '0');


      const iso =
        `${y}-${m}-${d}`;


      document.getElementById(
        'startDate'
      ).value = iso;


      document.getElementById(
        'endDate'
      ).value = iso;


      document.getElementById(
        'startTime'
      ).value = "12:00";


      document.getElementById(
        'endTime'
      ).value = "16:00";


      document.getElementById(
        'buffer'
      ).checked = false;


      const res =
        document.getElementById('result');


      res.innerHTML = "";

      res.style.display = "none";


      document.getElementById(
        'zipError'
      ).style.display = "none";


      document.getElementById(
        'resetBtn'
      ).style.display = "none";
    }


    /* =====================================================
       EVENT CAMPAIGN BUDGET
       ===================================================== */

    function handleBudgetSource() {

      const source =
        document.getElementById(
          'budgetSource'
        ).value;


      const otherWrapper =
        document.getElementById(
          'otherCampaignWrapper'
        );


      const otherInput =
        document.getElementById(
          'otherCampaign'
        );


      if (source === "Other") {

        otherWrapper.style.display =
          "block";

        otherInput.focus();

      } else {

        otherWrapper.style.display =
          "none";

        otherInput.value = "";
      }
    }


    function formatCurrency(amount) {

      return new Intl.NumberFormat(
        'en-US',
        {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      ).format(amount);
    }


    function formatLongDate(dateString) {

      const date =
        parseISODate(dateString);

      const month =
        String(
          date.getUTCMonth() + 1
        ).padStart(2, '0');

      const day =
        String(
          date.getUTCDate()
        ).padStart(2, '0');

      const year =
        String(
          date.getUTCFullYear()
        ).slice(-2);

      return `${month}/${day}/${year}`;
    }


    function calculateBudget() {

      const totalCampaignBudget =
        parseFloat(
          document.getElementById(
            'totalCampaignBudget'
          ).value
        );


      const totalEventBudget =
        parseFloat(
          document.getElementById(
            'totalEventBudget'
          ).value
        );


      const billingMonth =
        document.getElementById(
          'billingMonth'
        ).value;


      const budgetSource =
        document.getElementById(
          'budgetSource'
        ).value;


      const otherCampaign =
        document.getElementById(
          'otherCampaign'

      const eventEndDate =
        document.getElementById(
          'eventEndDate'
        ).value;


      const result =
        document.getElementById(
          'budgetResult'
        );


      if (
        isNaN(totalCampaignBudget) ||
        totalCampaignBudget < 0
      ) {

        showBudgetError(
          "Please enter a valid Total Campaign Budget."
        );

        return;
      }


      if (
        isNaN(totalEventBudget) ||
        totalEventBudget < 0
      ) {

        showBudgetError(
          "Please enter a valid Total Event Budget."
        );

        return;
      }


      if (!billingMonth) {

        showBudgetError(
          "Please select the Current Billing Month."
        );

        return;
      }


      if (!budgetSource) {

        showBudgetError(
          "Please select the campaign where the budget was taken from."
        );

        return;
      }


      if (
        budgetSource === "Other" &&
        !otherCampaign
      ) {

        showBudgetError(
          "Please enter the campaign name."
        );

        return;
      }


      if (!eventEndDate) {

        showBudgetError(
          "Please enter the Event Campaign End Date."
        );

        return;
      }


      if (
        totalEventBudget >
        totalCampaignBudget
      ) {

        showBudgetError(
          "The Total Event Budget cannot be greater than the Total Campaign Budget."
        );

        return;
      }


      const campaignName =
        budgetSource === "Other"
          ? otherCampaign
          : budgetSource;


      const currentBillingBudget =
        totalCampaignBudget -
        totalEventBudget;


      const formattedEndDate =
        formatLongDate(eventEndDate);


      result.innerHTML = `

        <div class="budget-message">

          ${formatCurrency(totalEventBudget)}
          was taken from the
          ${escapeHtml(campaignName)}
          campaign from
          ${billingMonth}
          budget for an event running until
          ${formattedEndDate}.

        </div>

        <strong>
          Remaining Budget for ${billingMonth}
        </strong>

        <div class="budget-total">
          ${formatCurrency(currentBillingBudget)}
        </div>

      `;


      result.style.display = "block";


      document.getElementById(
        'budgetResetBtn'
      ).style.display = "block";
    }


    function showBudgetError(message) {

      const result =
        document.getElementById(
          'budgetResult'
        );


      result.innerHTML =
        `<div class="error" style="margin:0;">${message}</div>`;


      result.style.display = "block";


      document.getElementById(
        'budgetResetBtn'
      ).style.display = "block";
    }


    function resetBudgetForm() {

      document.getElementById(
        'totalCampaignBudget'
      ).value = "";


      document.getElementById(
        'totalEventBudget'
      ).value = "";


      document.getElementById(
        'billingMonth'

      document.getElementById(
        'eventEndDate'
      ).value = "";


      document.getElementById(
        'otherCampaignWrapper'
      ).style.display = "none";


      const result =
        document.getElementById(
          'budgetResult'
        );


      result.innerHTML = "";

      result.style.display = "none";


      document.getElementById(
        'budgetResetBtn'
      ).style.display = "none";
    }


    function escapeHtml(text) {

      const div =
        document.createElement('div');

      div.textContent = text;

      return div.innerHTML;
    }


    /* =====================================================
       INITIALIZE DATES
       ===================================================== */

    (function initDates() {

      const today =
        new Date();


      const y =
        today.getFullYear();

      const m =
        String(
          today.getMonth() + 1
        ).padStart(2, '0');

      const d =
        String(
          today.getDate()
        ).padStart(2, '0');


      const iso =
        `${y}-${m}-${d}`;


      document.getElementById(
        'startDate'
      ).value = iso;


      document.getElementById(
        'endDate'
      ).value = iso;

    })();

  </script>

function toMinutes(value, unit){

  if(unit === 'notseen'){
    return Infinity;
  }

  const n = +value;

  if(!isFinite(n)){
    return NaN;
  }

  switch(unit){
    case 'minutes':
      return n;

    case 'hours':
      return n * 60;

    case 'days':
      return n * 1440;

    case 'weeks':
      return n * 10080;

    case 'months':
      return n * 43200;

    default:
      return NaN;
  }
}

/*
  Determine which troubleshooting scenario applies.

  Scenario priority:

  1. Lead Segment Has Not Been Detected
  2. Universal Segment Has Not Been Detected
  3. Both Lead and Universal have not recorded activity for an extended period of time
  4. Lead Pixel has not recorded activity for an extended period of time
  5. Universal Pixel has not recorded activity an extended period of time
  6. Lead and Universal fired at the same time
     AND user counts differ by 1 to 5
  7. Lead and Universal fired at the same time
  8. Universal users are lower than Lead users
  9. Lead activity is more recent than Universal activity
*/

function determineScenario(
  leadTime,
  uniTime,
  leadUsers,
  uniUsers,
  leadUnit,
  uniUnit
){

  /*
    Scenario 1:
    Lead activity = 0 minutes OR Not Yet Seen
  */

  const leadNotDetected =
    leadUnit === 'notseen' ||
    leadTime === 0;

  if(leadNotDetected){
    return 'lead-not-detected';
  }


  /*
    Scenario 2:
    Universal activity = 0 minutes OR Not Yet Seen
  */

  const universalNotDetected =
    uniUnit === 'notseen' ||
    uniTime === 0;

  if(universalNotDetected){
    return 'universal-not-detected';
  }


  /*
    Scenario 3:
    Both Lead and Universal have not recorded activity
    for an extended period of time.

    7 days = 10,080 minutes.
  */

const moreThanSevenDays =
  10080;

  if(
    isFinite(leadTime) &&
    isFinite(uniTime) &&
    leadTime > moreThanSevenDays &&
    uniTime > moreThanSevenDays
  ){
    return 'both-long-inactive';
  }


  /*
    Scenario 4:
    Lead Pixel has not recorded activity
    for an extended period of time.
  */

  if(
    isFinite(leadTime) &&
    leadTime > moreThanSevenDays
  ){
    return 'lead-long-inactive';
  }


  /*
    Scenario 5:
    Universal Pixel has not recorded activity
    for an extended period of time.
  */

  if(
    isFinite(uniTime) &&
    uniTime >  moreThanSevenDays
  ){
    return 'universal-long-inactive';
  }


  /*
    Scenario 6:
    Activity times are exactly the same
    AND user counts differ by 1 to 5.
  */

  const userDifference =
    Math.abs(leadUsers - uniUsers);

  if(
    isFinite(leadTime) &&
    isFinite(uniTime) &&
    leadTime === uniTime &&
    userDifference >= 1 &&
    userDifference <= 5
  ){
    return 'same-time-similar-users';
  }


  /*
    Scenario 7:
    Activity times are exactly the same.
  */

  if(
    isFinite(leadTime) &&
    isFinite(uniTime) &&
    leadTime === uniTime
  ){
    return 'same-time';
  }


  /*
    Scenario 8:
    Universal users are lower than Lead users.
  */

  if(
    isFinite(leadUsers) &&
    isFinite(uniUsers) &&
    uniUsers < leadUsers
  ){
    return 'universal-lower';
  }


  /*
    Scenario 9:
    Lead activity is more recent than Universal activity.

    Lower activity time = more recent.
  */

  if(
    isFinite(leadTime) &&
    isFinite(uniTime) &&
    leadTime < uniTime
  ){
    return 'lead-more-recent';
  }


  return 'shared';

/*
  Show troubleshooting section after a NO or MAYBE result.
*/

function showTroubleshooting(scenario, result = 'no'){

  const out = document.getElementById('out');

  let scenarioTitle;

  if(
    scenario === 'lead-not-detected' ||
    scenario === 'universal-not-detected'
  ){

    scenarioTitle =
      troubleshooting[scenario].title;

  }else{

    scenarioTitle =
      scenarioTitles[scenario] ||
      'Lead and Universal Segment user counts are too similar';

  }


  const resultDisplay =
    result === 'maybe'
      ? `
        <div class="big maybe">
          🤔 MAYBE 🤔
        </div>
      `
      : `
        <div class="big no">
          🥺 NO 💔
        </div>
      `;


  out.innerHTML = `

    ${resultDisplay}

    <div class="troubleshooting">

      <div class="troubleshooting-note">
        Please review troubleshooting instructions below.
      </div>

      <div class="scenario-label">
        ${scenarioTitle}
      </div>

      <div class="role-title">
        Select your role:
      </div>

      <div class="role-buttons">

        <button
          type="button"
          class="role-btn"
          onclick="selectRole('campaign', '${scenario}', this)"
        >
          Campaign Team
        </button>

        <button
          type="button"
          class="role-btn"
          onclick="selectRole('onboarding', '${scenario}', this)"
        >
          Onboarding & Client Success
        </button>

      </div>

      <div
        id="instructions"
        class="instructions"
        style="display:none;"
      ></div>

    </div>
  `;
}


/*
  Display instructions for the selected role.
*/

function selectRole(role, scenario, button){

  const instructions =
    document.getElementById('instructions');

  let instructionSet;

  /*
    These scenarios have their own separate
    Campaign Team and Onboarding instructions.
  */

  if(
    scenario === 'lead-not-detected' ||
    scenario === 'universal-not-detected' ||
    scenario === 'lead-long-inactive' ||
    scenario === 'universal-long-inactive' ||
    scenario === 'both-long-inactive'
  ){

    instructionSet =
      troubleshooting[scenario];

  }else{

    instructionSet =
      troubleshooting.shared;

  }

  if(role === 'campaign'){

    instructions.innerHTML =
      instructionSet.campaign;

  }else{

    instructions.innerHTML =
      instructionSet.onboarding;

  }

  instructions.style.display =
    'block';

  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.classList.remove('active');
  });

  button.classList.add('active');
}


/*
  Main checker.
*/

function check(){

  const leadUnit =
    document.getElementById('leadTimeUnit').value;

  const uniUnit =
    document.getElementById('uniTimeUnit').value;

  const leadTime =
    toMinutes(
      document.getElementById('leadTimeVal').value,
      leadUnit
    );

  const uniTime =
    toMinutes(
      document.getElementById('uniTimeVal').value,
      uniUnit
    );

  const leadUsers =
    +document.getElementById('leadUsers').value;

  const uniUsers =
    +document.getElementById('uniUsers').value;

  const scenario =
    determineScenario(
      leadTime,
      uniTime,
      leadUsers,
      uniUsers,
      leadUnit,
      uniUnit
    );

  const out =
    document.getElementById('out');

  out.style.display = 'block';


  /*
    Same-time and long-inactive scenarios = MAYBE.
  */

  if(
    scenario === 'same-time' ||
    scenario === 'same-time-similar-users' ||
    scenario === 'lead-long-inactive' ||
    scenario === 'universal-long-inactive' ||
    scenario === 'both-long-inactive'
  ){

    showTroubleshooting(
      scenario,
      'maybe'
    );

  }else{

    const notDetected =
      scenario === 'lead-not-detected' ||
      scenario === 'universal-not-detected';

    const activityOK =
      isFinite(leadTime) &&
      isFinite(uniTime)
        ? (uniTime < leadTime)
        : true;

    const usersOK =
      isFinite(uniUsers) &&
      isFinite(leadUsers) &&
      (uniUsers > leadUsers);

    const ok =
      !notDetected &&
      activityOK &&
      usersOK;

    if(ok){

      out.innerHTML = `
        <div class="big yes">
          🎉 YES 🎉
        </div>
      `;

    }else{

      showTroubleshooting(
        scenario,
        'no'
      );

    }
  }

  document.getElementById('resetBtn').style.display =
    'block';
}


/*
  Reset everything.
*/

function resetForm(){

  document.getElementById('leadTimeVal').value = '';
  document.getElementById('leadUsers').value = '';

  document.getElementById('uniTimeVal').value = '';
  document.getElementById('uniUsers').value = '';

  document.getElementById('leadTimeUnit').value =
    'minutes';

  document.getElementById('uniTimeUnit').value =
    'minutes';

  document.getElementById('leadTimeVal').disabled =
    false;

  document.getElementById('uniTimeVal').disabled =
    false;

  document.getElementById('out').style.display =
    'none';

  document.getElementById('resetBtn').style.display =
    'none';

  document.getElementById('checkBtn').disabled =
    true;

  document.getElementById('msg').style.display =
    'none';
}


/*
  Attach listeners to all fields.
*/

(function init(){

  const fields = [
    'leadTimeVal',
    'leadUsers',
    'uniTimeVal',
    'uniUsers'
  ];

  fields.forEach(id => {

    document.getElementById(id).addEventListener(
      'input',
      validate
    );

    document.getElementById(id).addEventListener(
      'change',
      validate
    );

  });


  [
    'leadTimeUnit',
    'uniTimeUnit'
  ].forEach(id => {

    document.getElementById(id).addEventListener(
      'change',
      () => {

        if(id === 'leadTimeUnit'){

          toggleTimeInput(
            'leadTimeUnit',
            'leadTimeVal'
          );

        }

        if(id === 'uniTimeUnit'){

          toggleTimeInput(
            'uniTimeUnit',
            'uniTimeVal'
          );

        }

        validate();

      }
    );

  });


  // Set initial state

  toggleTimeInput(
    'leadTimeUnit',
    'leadTimeVal'
  );

  toggleTimeInput(
    'uniTimeUnit',
    'uniTimeVal'
  );

  validate();

})();

</script>
