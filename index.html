      padding: 0 16px 40px;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-header-left {
      min-width: 0;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    h1 .geofence {
      color: var(--cyan);
    }

    h1 .counter {
      color: var(--orange);
    }

    .subtitle {
      max-width: none;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 0;
      overflow: hidden;
      border: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 9px;
      background: var(--cyan);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .section-heading-text h2 {
      margin: 0;
      color: var(--orange);
      font-size: 17px;
      font-weight: 700;
    }

    .section-heading-text p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .package-card {
      margin-bottom: 20px;
    }

    .package-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 18px 24px 22px;
    }

    .package-option {
      position: relative;
      min-height: 76px;
      padding: 15px 17px;
      background: #fff;
      border: 1.8px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .package-option:hover {
      border-color: var(--cyan);
      background: #f9ffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    .package-option.active {
      background: var(--soft-blue);
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(121, 192, 195, 0.15);
    }

    .package-option-content {
      padding-right: 28px;
    }

    .package-name {
      margin-bottom: 4px;
      color: var(--orange);
      font-size: 15px;
      font-weight: 700;
    }

    .package-locations {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .package-check {
      position: absolute;
      top: 13px;
      right: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--cyan);
      color: white;
      font-size: 11px;
      font-weight: 700;
    }

    .package-option.active .package-check {
      display: flex;
    }

    .paste-card {
      margin-bottom: 20px;
    }

    .paste-header-right {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
    }

    .paste-content {
      padding: 20px 24px 24px;
    }

    .paste-instruction {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      padding: 13px 15px;
      background: var(--soft-blue);
      border: 1px solid #d8f1f3;
      border-radius: 12px;
    }

    .paste-instruction-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 7px;
      background: white;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 700;
    }

    .paste-instruction-text {
      min-width: 0;
    }

    .paste-instruction-title {
      margin-bottom: 2px;
      color: var(--orange);
      font-size: 12px;
      font-weight: 700;
    }

    .paste-instruction-description {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      font-weight: 500;
    }

    .table-wrapper {
      width: 100%;
      overflow: auto;
      border: 1.8px solid var(--line);
      border-radius: 12px;
      background: white;
      max-height: 520px;
    }

    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;
      background: white;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px 11px;
      background: #f4fbfc;
      color: var(--orange);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }

    th:last-child {
      border-right: none;
    }

    td {
      padding: 9px 11px;
      background: white;
      color: #000000;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.45;
      min-height: 38px;
      vertical-align: middle;
      white-space: normal;
      overflow-wrap: anywhere;
      min-width: 90px;
    }

    tbody tr:nth-child(even) td {
      background: #fcfeff;
    }

    tbody tr:hover td {
      background: #f9ffff;
    }

    td:last-child {
      border-right: none;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td[contenteditable="true"] {
      cursor: text;
    }

    td[contenteditable="true"]:focus {
      outline: 2px solid var(--cyan);
      outline-offset: -2px;
      background: #f7ffff !important;
    }

    th:nth-child(1),
    td:nth-child(1) {
      min-width: 240px;
    }

    th:nth-child(2),
    td:nth-child(2) {
      min-width: 300px;
    }

    .empty-row td {
      height: 46px;
      color: #000000;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 15px;
    }

    .action-note {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 10px 17px;
      font-family: "Quicksand", sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .primary-btn {
      background: var(--orange);
      color: white;
      padding: 13px 22px;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(255, 123, 61, 0.2);
    }

    .primary-btn:hover {
      background: #ff905c;
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(255, 123, 61, 0.25);
    }

    .reset-btn {
      background: white;
      color: var(--cyan);
      border: 2px solid var(--cyan);
      padding: 11px 18px;
    }

    .reset-btn:hover {
      background: var(--cyan);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .message {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: var(--red-light);
      color: var(--red);
      border: 1px solid #f0cccc;
    }

    .message.success {
      background: var(--green-light);
      color: var(--green);
      border: 1px solid #cce6d6;
    }

    .results-card {
      overflow: hidden;
    }

    .results-top {
      padding: 21px 24px 22px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .results-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .results-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--soft-pink);
      color: var(--orange);
      font-size: 13px;
      font-weight: 700;
    }

    .results-title {
      margin: 0;
      color: var(--orange);
      font-size: 17px;
      font-weight: 700;
    }

    .package-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      background: var(--soft-blue);
      border: 1px solid #d7eeee;
      border-radius: 999px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
    }

    .package-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      margin-bottom: 20px;
    }

    .summary-card {
      position: relative;
      padding: 16px 17px;
      background: #fcfeff;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .summary-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--line);
    }

    .summary-card.orange-card::before {
      background: var(--orange);
    }

    .summary-card.green-card::before {
      background: var(--green);
    }

    .summary-card.red-card::before {
      background: var(--red);
    }

    .summary-label {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .summary-value {
      color: var(--cyan);
      font-size: 25px;
      line-height: 1;
      font-weight: 700;
    }

    .summary-value.orange {
      color: var(--orange);
    }

    .summary-value.green {
      color: var(--green);
    }

    .summary-value.red {
      color: var(--red);
    }

    .unlimited-message {
      display: none;
      margin: -6px 0 16px;
      padding: 10px 13px;
      background: var(--green-light);
      border: 1px solid #cce6d6;
      border-radius: 10px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
    }

    .campaign-tabs-wrapper {
      margin-top: 4px;
    }

    .campaign-tabs-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .campaign-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 13px;
    }

    .campaign-tab {
      background: white;
      color: var(--cyan);
      border: 1.8px solid var(--cyan);
      border-radius: 8px;
      padding: 8px 11px;
      font-family: "Quicksand", sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .campaign-tab:hover {
      background: var(--soft-blue);
      border-color: var(--cyan);
    }

    .campaign-tab.active {
      background: var(--orange);
      color: white;
      border-color: var(--orange);
    }

    .campaign-results {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .campaign-result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 12px 15px;
      background: var(--soft-blue);
      border-bottom: 1px solid var(--line);
      color: var(--orange);
      font-size: 14px;
      font-weight: 900;
    }

    .campaign-result-header-count {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 0;
      background: transparent;
      border: none;
      color: var(--orange);
      font-size: 14px;
      font-weight: 900;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 10px 15px;
      background: white;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-row:hover {
      background: #fbffff;
    }

    .result-name {
      min-width: 0;
      color: var(--text);
      font-weight: 600;
      word-break: break-word;
    }

    .result-count {
      flex-shrink: 0;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
    }

    .result-footer {
      padding: 11px 15px;
      background: #f9fbfc;
      border-top: 1px solid var(--line);
      font-size: 11px;
      font-weight: 700;
    }

    .result-footer.available {
      color: var(--green);
    }

    .result-footer.reached {
      color: var(--red);
    }

    .result-footer.unlimited {
      background: var(--green-light);
      color: var(--green);
    }

    @media (max-width: 1000px) {
      .package-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .subtitle {
        white-space: normal;
      }
    }

    @media (max-width: 700px) {
      .container {
        padding: 20px 12px 35px;
      }

      h1 {
        font-size: 28px;
      }

      .card-header,
      .paste-content,
      .results-top {
        padding-left: 17px;
        padding-right: 17px;
      }

      .package-grid {
        grid-template-columns: 1fr 1fr;
        padding-left: 17px;
        padding-right: 17px;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .action-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .button-group {
        width: 100%;
      }

      .button-group button {
        flex: 1;
      }
    }

    @media (max-width: 480px) {
      .package-grid {
        grid-template-columns: 1fr;
      }

      .results-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="page-header">
    <div class="page-header-left">

      <h1>
        <span class="geofence">Geofence</span>
        <span class="counter">Counter</span>
      </h1>

      <p class="subtitle">
        Select your package, paste your TapClicks export, and instantly see how many geofences you are using and how many remain available.
      </p>

    </div>
  </header>


  <section class="card package-card">

    <div class="card-header">

      <div class="section-heading">

        <div class="section-number">
          1
        </div>

        <div class="section-heading-text">

          <h2>
            Select Package
          </h2>

          <p>
            Choose the geofence limit for this campaign.
          </p>

        </div>

      </div>

    </div>


    <div class="package-grid">

      <div
        class="package-option"
        data-limit="10"
        data-package="Saver"
      >

        <div class="package-check">
          ✓
        </div>

        <div class="package-option-content">

          <div class="package-name">
            Saver
          </div>

          <div class="package-locations">
            10 Locations
          </div>

        </div>

      </div>


      <div
        class="package-option active"
        data-limit="20"
        data-package="Standard"
      >

        <div class="package-check">
          ✓
        </div>

        <div class="package-option-content">

          <div class="package-name">
            Standard
          </div>

          <div class="package-locations">
            20 Locations
          </div>

        </div>

      </div>


      <div
        class="package-option"
        data-limit="40"
        data-package="Premium"
      >

        <div class="package-check">
          ✓
        </div>

        <div class="package-option-content">

          <div class="package-name">
            Premium
          </div>

          <div class="package-locations">
            40 Locations
          </div>

        </div>

      </div>


      <div
        class="package-option"
        data-limit="Infinity"
        data-package="Unlimited"
      >

        <div class="package-check">
          ✓
        </div>

        <div class="package-option-content">

          <div class="package-name">
            Unlimited
          </div>

          <div class="package-locations">
            40+ Locations
          </div>

        </div>

      </div>

    </div>

  </section>


  <section class="card paste-card">

    <div class="card-header">

      <div class="section-heading">

        <div class="section-number">
          2
        </div>

        <div class="section-heading-text">

          <h2>
            Paste TapClicks Data
          </h2>

          <p>
            Your exported data will automatically populate the table.
          </p>

        </div>

      </div>


      <div class="paste-header-right">
        Paste like Excel
      </div>

    </div>


    <div class="paste-content">

      <div class="table-wrapper">

        <table id="TapClicksTable">

          <thead id="topClicksHead">

            <tr>

              <th>
                Geo Fence
              </th>

              <th>
                Campaign
              </th>

              <th>
                Impressions
              </th>

              <th>
                CPM
              </th>

              <th>
                Clicks
              </th>

              <th>
                CTR
              </th>

              <th>
                CPC
              </th>

              <th>
                Total Cost
              </th>

              <th>
                Walk Ins
              </th>

              <th>
                Cost Per Walk In
              </th>

            </tr>

          </thead>


          <tbody id="topClicksBody">

            <tr class="empty-row">

              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>
              <td contenteditable="true"></td>

            </tr>

          </tbody>

        </table>

      </div>


      <div class="action-bar">

        <div class="button-group">

          <button
            type="button"
            class="primary-btn"
            id="calculateBtn"
          >
            Calculate Geofences
          </button>


          <button
            type="button"
            class="reset-btn"
            id="resetBtn"
          >
            Reset
          </button>

        </div>

      </div>


      <div
        id="pasteMessage"
        class="message"
      ></div>

    </div>

  </section>


  <section class="card results-card">

    <div class="results-top">

      <div class="results-header">

        <div class="results-title-area">

          <div class="results-icon">
            #
          </div>

          <h2 class="results-title">
            Geofence Results
          </h2>

        </div>


        <div class="package-status">

          <span class="package-status-dot"></span>

          <span>
            Package:
          </span>

          <span id="selectedPackageLabel">
            Standard
          </span>

        </div>

      </div>


      <div class="summary-grid">

        <div class="summary-card">

          <div class="summary-label">
            Rows Entered
          </div>

          <div
            class="summary-value"
            id="rowsEntered"
          >
            0
          </div>

        </div>


        <div class="summary-card orange-card">

          <div class="summary-label">
            Unique Geofences
          </div>

          <div
            class="summary-value orange"
            id="uniqueGeofences"
          >
            0
          </div>

        </div>


        <div
          class="summary-card green-card"
          id="additionalAvailableCard"
        >

          <div class="summary-label">
            Additional Available
          </div>

          <div
            class="summary-value green"
            id="additionalAvailable"
          >
            20
          </div>

        </div>

      </div>


      <div
        id="unlimitedMessage"
        class="unlimited-message"
      >
        Unlimited additional geofences available.
      </div>


      <div class="campaign-tabs-wrapper">

        <div class="campaign-tabs-label">
          Campaigns
        </div>

        <div
          id="campaignTabs"
          class="campaign-tabs"
        ></div>

      </div>


      <div
        id="campaignResults"
        class="campaign-results"
      >

        <div class="campaign-result-header">

          <span>
            Paste your TapClicks data above to view results.
          </span>

        </div>

      </div>

    </div>

  </section>

</div>


<script>

  let selectedPackage = "Standard";
  let selectedLimit = 20;

  let parsedRows = [];
  let campaignGroups = {};
  let activeCampaign = null;

  let pastedHeaders = [
    "Geo Fence",
    "Campaign",
    "Impressions",
    "CPM",
    "Clicks",
    "CTR",
    "CPC",
    "Total Cost",
    "Walk Ins",
    "Cost Per Walk In"
  ];


  const topClicksBody =
    document.getElementById(
      "topClicksBody"
    );


  const topClicksHead =
    document.getElementById(
      "topClicksHead"
    );


  /* =========================================================
     TEXT CLEANING
     ========================================================= */

  function normalizeField(value) {

    return String(value ?? "")
      .replace(/\u00A0/g, " ")
      .replace(/[\t\r\n]+/g, " ")
      .replace(/ {2,}/g, " ")
      .trim();

  }


  function cleanDisplayName(name) {

    return normalizeField(name);

  }


  function cleanGeofenceName(name) {

    let value =
      normalizeField(name)
        .toLowerCase();

    value =
      value
        .replace(/[_-]+/g, " ")
        .replace(/[^\w\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    value =
      value.replace(
        /\bleasing\s+office\b/g,
        ""
      );

    value =
      value.replace(
        /\bleasing\b/g,
        ""
      );

    value =
      value.replace(
        /\bresidents?\b/g,
        ""
      );

    value =
      value.replace(
        /\bresidences?\b/g,
        ""
      );

    value =
      value.replace(
        /\s+\d+\s*$/g,
        ""
      );

    return value
      .replace(/\s+/g, " ")
      .trim();

  }


  /* =========================================================
     CLIPBOARD PARSING
     ========================================================= */

  function parseClipboardHTML(html) {

    if (!html) {
      return null;
    }

    const parser =
      new DOMParser();

    const doc =
      parser.parseFromString(
        html,
        "text/html"
      );

    const sourceTable =
      doc.querySelector("table");

    if (!sourceTable) {
      return null;
    }

    const sourceRows =
      Array.from(
        sourceTable.querySelectorAll("tr")
      );

    if (!sourceRows.length) {
      return null;
    }

    const grid = [];

    sourceRows.forEach(sourceRow => {

      const cells =
        Array.from(
          sourceRow.querySelectorAll(
            "th, td"
          )
        );

      if (!cells.length) {
        return;
      }

      const row =
        cells.map(cell =>
          normalizeField(
            cell.innerText ||
            cell.textContent ||
            ""
          )
        );

      grid.push(row);

    });

    return grid.length
      ? grid
      : null;

  }


  function parseClipboardText(text) {

    if (!text || !text.trim()) {
      return null;
    }

    const lines =
      text
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n");

    const rows = [];

    lines.forEach(line => {

      if (!line.trim()) {
        return;
      }

      /*
       * IMPORTANT:
       *
       * Clipboard data copied from Excel/Top Clicks
       * is normally TAB separated.
       *
       * We split on TAB first.
       *
       * We DO NOT treat the pipe character as
       * another column when tabs already exist.
       */

      if (line.includes("\t")) {

        rows.push(
          line
            .split("\t")
            .map(value =>
              normalizeField(value)
            )
        );

        return;

      }

      /*
       * Fallback for plain pipe-delimited
       * TapClicks text.
       */

      if (line.includes("|")) {

        let fields =
          line
            .split("|")
            .map(value =>
              normalizeField(value)
            );

        /*
         * Remove only the visual pipe boundaries.
         *
         * Example:
         *
         * | Geo Fence | Campaign | Clicks |
         *
         * becomes:
         *
         * Geo Fence | Campaign | Clicks
         */

        if (
          fields.length &&
          fields[0] === ""
        ) {
          fields.shift();
        }

        if (
          fields.length &&
          fields[fields.length - 1] === ""
        ) {
          fields.pop();
        }

        rows.push(fields);

      }

    });

    return rows.length
      ? rows
      : null;

  }


  function getClipboardGrid(
    clipboard
  ) {

    /*
     * First choice:
     * Use the actual HTML table from
     * Excel / Top Clicks.
     *
     * This preserves the real columns.
     */

    const html =
      clipboard.getData(
        "text/html"
      );

    const htmlGrid =
      parseClipboardHTML(
        html
      );

    if (
      htmlGrid &&
      htmlGrid.length
    ) {

      return htmlGrid;

    }


    /*
     * Second choice:
     * Use plain text.
     *
     * Excel normally gives us
     * TAB separated values here.
     */

    const text =
      clipboard.getData(
        "text/plain"
      );

    return parseClipboardText(
      text
    );

  }


  function isSeparatorRow(row) {

    if (!row.length) {
      return true;
    }

    return row.every(value => {

      const cleaned =
        String(value || "")
          .replace(/\s/g, "");

      return (
        cleaned === "" ||
        /^:?-+:?$/.test(
          cleaned
        )
      );

    });

  }


  function isHeaderRow(row) {

    if (!row.length) {
      return false;
    }

    const first =
      normalizeField(
        row[0]
      ).toLowerCase();

    const second =
      normalizeField(
        row[1] || ""
      ).toLowerCase();

    return (
      (
        first === "geo fence" ||
        first === "geofence"
      ) &&
      second === "campaign"
    );

  }


  /*
   * Keeps the first two columns in their
   * correct positions and allows every
   * additional pasted column to remain
   * exactly where it came from.
   */

  function normalizePastedGrid(
    grid
  ) {

    if (
      !grid ||
      !grid.length
    ) {
      return {
        headers: [],
        rows: []
      };
    }

    let rows =
      grid.map(row =>
        row.map(value =>
          normalizeField(value)
        )
      );


    /*
     * Remove completely empty rows.
     */

    rows =
      rows.filter(row =>
        row.some(value =>
          normalizeField(value) !== ""
        )
      );


    /*
     * Remove separator rows.
     */

    rows =
      rows.filter(row =>
        !isSeparatorRow(row)
      );


    if (!rows.length) {
      return {
        headers: [],
        rows: []
      };
    }


    /*
     * If Top Clicks included its header,
     * keep it as the visible table header.
     */

    let headers = null;

    if (
      isHeaderRow(
        rows[0]
      )
    ) {

      headers =
        rows.shift();

    }


    if (!headers) {

      headers = [
        "Geo Fence",
        "Campaign",
        "Impressions",
        "CPM",
        "Clicks",
        "CTR",
        "CPC",
        "Total Cost",
        "Walk Ins",
        "Cost Per Walk In"
      ];

    }


    /*
     * Find the widest actual pasted row.
     */

    let columnCount =
      headers.length;

    rows.forEach(row => {

      if (
        row.length >
        columnCount
      ) {

        columnCount =
          row.length;

      }

    });


    /*
     * Expand headers to match
     * the actual pasted grid.
     */

    while (
      headers.length <
      columnCount
    ) {

      headers.push(
        `Column ${headers.length + 1}`
      );

    }


    /*
     * Every row gets exactly the
     * same number of cells.
     *
     * This is the part that makes
     * the table behave like Excel.
     */

    rows =
      rows.map(row => {

        const copy =
          row.slice(
            0,
            columnCount
          );

        while (
          copy.length <
          columnCount
        ) {

          copy.push("");

        }

        return copy;

      });


    return {
      headers:
        headers.slice(
          0,
          columnCount
        ),

      rows:
        rows
    };

  }


  /* =========================================================
     TABLE RENDERING
     ========================================================= */

  function renderTableHeaders(
    headers
  ) {

    topClicksHead.innerHTML = "";

    const tr =
      document.createElement(
        "tr"
      );

    headers.forEach(
      header => {

        const th =
          document.createElement(
            "th"
          );

        th.textContent =
          normalizeField(
            header
          );

        tr.appendChild(
          th
        );

      }
    );

    topClicksHead.appendChild(
      tr
    );

  }


  function renderTableRows(
    rows
  ) {

    topClicksBody.innerHTML = "";

    rows.forEach(
      row => {

        const tr =
          document.createElement(
            "tr"
          );

        row.forEach(
          value => {

            const td =
              document.createElement(
                "td"
              );

            td.contentEditable =
              "true";

            td.textContent =
              normalizeField(
                value
              );

            tr.appendChild(
              td
            );

          }
        );

        topClicksBody.appendChild(
          tr
        );

      }
    );

  }


  function createEmptyTable() {

    pastedHeaders = [
      "Geo Fence",
      "Campaign",
      "Impressions",
      "CPM",
      "Clicks",
      "CTR",
      "CPC",
      "Total Cost",
      "Walk Ins",
      "Cost Per Walk In"
    ];

    renderTableHeaders(
      pastedHeaders
    );

    topClicksBody.innerHTML = `

      <tr class="empty-row">

        ${pastedHeaders
          .map(
            () =>
              `<td contenteditable="true"></td>`
          )
          .join("")}

      </tr>

    `;

  }


  /* =========================================================
     CONVERT PASTED GRID TO INTERNAL ROWS
     ========================================================= */

  function gridToParsedRows(
    grid
  ) {

    const rows = [];

    grid.forEach(
      row => {

        if (
          row.length < 2
        ) {
          return;
        }

        const geoFence =
          normalizeField(
            row[0] || ""
          );

        const campaign =
          normalizeField(
            row[1] || ""
          );

        /*
         * The calculation only needs
         * Geo Fence and Campaign.
         *
         * The remaining columns stay
         * visible in the table.
         */

        if (
          !geoFence ||
          !campaign
        ) {
          return;
        }

        rows.push({

          geoFence:
            geoFence,

          campaign:
            campaign,

          impressions:
            normalizeField(
              row[2] || ""
            ),

          cpm:
            normalizeField(
              row[3] || ""
            ),

          clicks:
            normalizeField(
              row[4] || ""
            ),

          ctr:
            normalizeField(
              row[5] || ""
            ),

          cpc:
            normalizeField(
              row[6] || ""
            ),

          totalCost:
            normalizeField(
              row[7] || ""
            ),

          walkIns:
            normalizeField(
              row[8] || ""
            ),

          costPerWalkIn:
            normalizeField(
              row[9] || ""
            )

        });

      }
    );

    return rows;

  }


  /* =========================================================
     PASTE HANDLING
     ========================================================= */

  function populateTableFromPaste(
    clipboard
  ) {

    const grid =
      getClipboardGrid(
        clipboard
      );

    if (
      !grid ||
      !grid.length
    ) {

      showMessage(
        "No usable TapClicks rows were found in the pasted data.",
        "error"
      );

      return;

    }


    const normalized =
      normalizePastedGrid(
        grid
      );


    if (
      !normalized.rows.length
    ) {

      showMessage(
        "No usable TapClicks rows were found in the pasted data.",
        "error"
      );

      return;

    }


    /*
     * Save the actual pasted
     * column structure.
     */

    pastedHeaders =
      normalized.headers;


    /*
     * Draw the exact number
     * of columns that were pasted.
     */

    renderTableHeaders(
      pastedHeaders
    );

    renderTableRows(
      normalized.rows
    );


    /*
     * Convert the first two columns
     * into the data used by the
     * Geofence Counter.
     */

    parsedRows =
      gridToParsedRows(
        normalized.rows
      );


    if (!parsedRows.length) {

      showMessage(
        "The pasted data needs at least Geo Fence and Campaign columns.",
        "error"
      );

      return;

    }


    showMessage(
      `${normalized.rows.length} rows pasted successfully.`,
      "success"
    );


    calculateResults();

  }


  document.addEventListener(
    "paste",
    function(event) {

      const clipboard =
        event.clipboardData;

      if (!clipboard) {
        return;
      }


      const hasHTML =
        clipboard.types &&
        clipboard.types.includes(
          "text/html"
        );

      const text =
        clipboard.getData(
          "text/plain"
        );


      if (
        !hasHTML &&
        (
          !text ||
          !text.trim()
        )
      ) {
        return;
      }


      /*
       * Only intercept paste when
       * it actually looks like table data.
       */

      const looksLikeTable =
        hasHTML ||
        (
          text &&
          (
            text.includes("\t") ||
            text.includes("|")
          )
        );


      if (!looksLikeTable) {
        return;
      }


      event.preventDefault();
      event.stopPropagation();


      populateTableFromPaste(
        clipboard
      );

    },
    true
  );


  /* =========================================================
     READ TABLE
     ========================================================= */

  function readTableRows() {

    const rows = [];

    const trs =
      Array.from(
        topClicksBody.querySelectorAll(
          "tr"
        )
      );


    trs.forEach(
      tr => {

        const cells =
          Array.from(
            tr.querySelectorAll(
              "td"
            )
          );


        if (
          cells.length < 2
        ) {
          return;
        }


        const values =
          cells.map(
            cell =>
              normalizeField(
                cell.textContent
              )
          );


        if (
          !values[0] ||
          !values[1]
        ) {
          return;
        }


        rows.push({

          geoFence:
            values[0],

          campaign:
            values[1],

          impressions:
            values[2] || "",

          cpm:
            values[3] || "",

          clicks:
            values[4] || "",

          ctr:
            values[5] || "",

          cpc:
            values[6] || "",

          totalCost:
            values[7] || "",

          walkIns:
            values[8] || "",

          costPerWalkIn:
            values[9] || ""

        });

      }
    );


    return rows;

  }


  /* =========================================================
     CAMPAIGN LOGIC
     ========================================================= */

  function getParentCampaign(
    campaign
  ) {

    const value =
      normalizeField(
        campaign
      );

    const suffixes = [
      "_Competitor-Resident",
      "_Employer-POI"
    ];


    for (
      const suffix of suffixes
    ) {

      const index =
        value.indexOf(
          suffix
        );


      if (
        index !== -1
      ) {

        return value.substring(
          0,
          index +
          suffix.length
        );

      }

    }


    return value;

  }


  function isIsolationCampaign(
    campaign
  ) {

    const parent =
      getParentCampaign(
        campaign
      );


    return (
      campaign !== parent &&
      campaign.startsWith(
        parent + "_"
      )
    );

  }


  function getUniqueGeofences(
    rows
  ) {

    const map =
      new Map();


    rows.forEach(
      row => {

        const displayName =
          cleanDisplayName(
            row.geoFence
          );


        const key =
          cleanGeofenceName(
            displayName
          );


        if (!key) {
          return;
        }


        /*
         * Unknown should never
         * count as a geofence.
         */

        if (
          key === "unknown"
        ) {
          return;
        }


        if (
          !map.has(key)
        ) {

          map.set(
            key,
            {
              key: key,
              displayName:
                displayName,
              rows: [row]
            }
          );

        } else {

          map
            .get(key)
            .rows
            .push(row);

        }

      }
    );


    return map;

  }


  function buildCampaignGroups(
    rows
  ) {

    const groups = {};


    rows.forEach(
      row => {

        const campaign =
          cleanDisplayName(
            row.campaign
          );


        if (!campaign) {
          return;
        }


        const parent =
          getParentCampaign(
            campaign
          );


        if (!groups[parent]) {

          groups[parent] = {

            campaign:
              parent,

            rows: [],

            isolatedRows: [],

            allRows: []

          };

        }


        if (
          isIsolationCampaign(
            campaign
          )
        ) {

          groups[parent]
            .isolatedRows
            .push(row);

        } else {

          groups[parent]
            .rows
            .push(row);

        }

      }
    );


    Object.values(
      groups
    ).forEach(
      group => {

        group.allRows = [
          ...group.rows,
          ...group.isolatedRows
        ];

      }
    );


    return groups;

  }


  function getCampaignUniqueGeofences(
    group
  ) {

    const map =
      new Map();


    group.allRows.forEach(
      row => {

        const displayName =
          cleanDisplayName(
            row.geoFence
          );


        const key =
          cleanGeofenceName(
            displayName
          );


        if (!key) {
          return;
        }


        if (
          key === "unknown"
        ) {
          return;
        }


        if (
          !map.has(key)
        ) {

          map.set(
            key,
            {
              key: key,
              displayName:
                displayName
            }
          );

        }

      }
    );


    return map;

  }


  /* =========================================================
     CALCULATE
     ========================================================= */

  function calculateResults() {

    const tableRows =
      readTableRows();


    if (
      tableRows.length
    ) {

      parsedRows =
        tableRows;

    }


    if (
      !parsedRows.length
    ) {

      showMessage(
        "Please paste your TapClicks data first.",
        "error"
      );

      return;

    }


    campaignGroups =
      buildCampaignGroups(
        parsedRows
      );


    updateSummary();
    renderCampaignTabs();
    renderCampaignResults();

  }


  /* =========================================================
     SUMMARY
     ========================================================= */

  function updateSummary() {

    const unique =
      getUniqueGeofences(
        parsedRows
      );


    document.getElementById(
      "rowsEntered"
    ).textContent =
      parsedRows.length;


    document.getElementById(
      "uniqueGeofences"
    ).textContent =
      unique.size;


    const additional =
      document.getElementById(
        "additionalAvailable"
      );


    const additionalCard =
      document.getElementById(
        "additionalAvailableCard"
      );


    const unlimited =
      document.getElementById(
        "unlimitedMessage"
      );


    if (
      selectedLimit === Infinity
    ) {

      additional.textContent =
        "∞";


      additional.className =
        "summary-value green";


      additionalCard.classList.remove(
        "red-card"
      );


      additionalCard.classList.add(
        "green-card"
      );


      unlimited.style.display =
        "block";

    } else {

      const available =
        selectedLimit -
        unique.size;


      additional.textContent =
        available;


      if (
        available < 0
      ) {

        additional.className =
          "summary-value red";


        additionalCard.classList.remove(
          "green-card"
        );


        additionalCard.classList.add(
          "red-card"
        );

      } else {

        additional.className =
          "summary-value green";


        additionalCard.classList.remove(
          "red-card"
        );


        additionalCard.classList.add(
          "green-card"
        );

      }


      unlimited.style.display =
        "none";

    }

  }


  /* =========================================================
     CAMPAIGN TABS
     ========================================================= */

  function renderCampaignTabs() {

    const tabs =
      document.getElementById(
        "campaignTabs"
      );


    tabs.innerHTML = "";


    const campaigns =
      Object.keys(
        campaignGroups
      );


    if (
      !campaigns.length
    ) {
      return;
    }


    if (
      !activeCampaign ||
      !campaignGroups[
        activeCampaign
      ]
    ) {

      activeCampaign =
        campaigns[0];

    }


    campaigns.forEach(
      campaign => {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "campaign-tab" +
          (
            campaign ===
            activeCampaign
              ? " active"
              : ""
          );


        button.textContent =
          campaign;


        button.addEventListener(
          "click",
          () => {

            activeCampaign =
              campaign;


            renderCampaignTabs();
            renderCampaignResults();

          }
        );


        tabs.appendChild(
          button
        );

      }
    );

  }


  /* =========================================================
     CAMPAIGN RESULTS
     ========================================================= */

  function renderCampaignResults() {

    const container =
      document.getElementById(
        "campaignResults"
      );


    if (
      !parsedRows.length
    ) {

      container.innerHTML = `

        <div class="campaign-result-header">

          <span>
            Paste your TapClicks data above to view results.
          </span>

        </div>

      `;


      return;

    }


    const campaigns =
      Object.keys(
        campaignGroups
      );


    if (
      !campaigns.length
    ) {

      container.innerHTML = `

        <div class="campaign-result-header">

          <span>
            No campaigns found.
          </span>

        </div>

      `;


      return;

    }


    if (!activeCampaign) {

      activeCampaign =
        campaigns[0];

    }


    const group =
      campaignGroups[
        activeCampaign
      ];


    if (!group) {
      return;
    }


    const unique =
      getCampaignUniqueGeofences(
        group
      );


    const names =
      Array.from(
        unique.values()
      );


    let html = `

      <div class="campaign-result-header">

        <span>
          ${escapeHtml(
            activeCampaign
          )}
        </span>

        <span class="campaign-result-header-count">

          ${names.length}

          ${
            names.length === 1
              ? "geofence"
              : "geofences"
          }

        </span>

      </div>

    `;


    if (
      !names.length
    ) {

      html += `

        <div class="result-row">

          <div class="result-name">
            No geofences found.
          </div>

        </div>

      `;

    } else {

      names.forEach(
        item => {

          html += `

            <div class="result-row">

              <div class="result-name">

                ${escapeHtml(
                  item.displayName
                )}

              </div>

              <div class="result-count">
                Counted once
              </div>

            </div>

          `;

        }
      );

    }


    container.innerHTML =
      html;

  }


  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value || ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================================================
     MESSAGE
     ========================================================= */

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "pasteMessage"
      );


    message.textContent =
      text;


    message.className =
      `message show ${type}`;


    clearTimeout(
      showMessage.timer
    );


    showMessage.timer =
      setTimeout(
        () => {

          message.className =
            "message";

        },
        3500
      );

  }


  /* =========================================================
     PACKAGE SELECTION
     ========================================================= */

  document
    .querySelectorAll(
      ".package-option"
    )
    .forEach(
      card => {

        card.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".package-option"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            card.classList.add(
              "active"
            );


            selectedPackage =
